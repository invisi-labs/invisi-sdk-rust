[package]
name = "invisi-sdk-primitives"
version = "1.2.4"
edition = "2021"
authors = ["InvisiPay team"]
repository = "https://github.com/invisi-lab/invisi-sdk-rust"
license = "Apache-2.0"
description = "Pure field, key, commitment, wallet and delivery primitives"

readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "NOTICE", "src/**", "assets/**", "provenance/**", "testdata/**", "tests/**", "include/**"]

[dependencies]
alloy-primitives = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
hex = "0.4"
ark-bn254 = { version = "0.4", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "0.4", default-features = false }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
hkdf = "0.12"
k256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
zeroize = "1"
decaf377-fmd = "=2.1.1"
