name: Rust SDK
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python3 scripts/test_publish_release.py
      - run: python3 scripts/check-english.py
      - run: python3 scripts/check-boundaries.py
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --all-features --release
      - run: cargo build --locked -p invisi-sdk-ffi --release
      - run: python3 scripts/check-native-exports.py target/release/libinvisi_sdk_ffi.so
      - run: cargo run -p invisi-sdk-examples --bin note-output
      - run: python3 scripts/check-release.py --work-dir "${{ runner.temp }}/invisi-release"
