[package]
name = "invisi-sdk-session"
version = "1.3.1"
edition = "2021"
license = "Apache-2.0"
description = "Invisi SDK session capabilities"

readme = "README.md"
repository = "https://github.com/invisi-labs/invisi-sdk-rust"
include = ["Cargo.toml", "README.md", "LICENSE", "NOTICE", "src/**", "assets/**", "provenance/**", "testdata/**", "tests/**", "include/**"]

[dependencies]
invisi-sdk-primitives = { path = "../invisi-sdk-primitives", version = "=1.3.1" }
invisi-sdk-protocol = { path = "../invisi-sdk-protocol", version = "=1.3.1" }
invisi-sdk-rpc = { path = "../invisi-sdk-rpc", version = "=1.3.1" }
invisi-sdk = { path = "../..", version = "=1.3.1" }
alloy-primitives = { version = "=1.5.7", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
hex = "0.4"
alloy-sol-types = { version = "=1.5.7", features = ["json"] }
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rusqlite = { version = "0.38", features = ["bundled"], optional = true }

[features]
default = []
sqlite = ["dep:rusqlite"]

[dev-dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
