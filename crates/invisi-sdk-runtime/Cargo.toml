[package]
name = "invisi-sdk-runtime"
version = "1.1.8"
edition = "2021"
license = "Apache-2.0"
description = "Invisi SDK runtime capabilities"

readme = "README.md"
repository = "https://github.com/invisi-lab/invisi-sdk-rust"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "assets/**", "provenance/**", "testdata/**", "tests/**", "include/**"]

[dependencies]
invisi-sdk-core = { path = "../invisi-sdk-core", version = "=1.1.8" }
invisi-sdk-protocol = { path = "../invisi-sdk-protocol", version = "=1.1.8" }
invisi-sdk-rpc = { path = "../invisi-sdk-rpc", version = "=1.1.8" }
invisi-sdk-prover = { path = "../invisi-sdk-prover", version = "=1.1.8" }
alloy-primitives = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
hex = "0.4"
alloy-sol-types = { version = "0.8", features = ["json"] }
k256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
rand = "0.8"
sha2 = "0.10"
zeroize = "1"
