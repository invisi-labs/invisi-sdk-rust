[package]
name = "invisi-sdk-core"
version = "0.1.0"
edition = "2021"
authors = ["InvisiPay team"]
repository = "https://github.com/invisi-lab/invisi-sdk-rust"
license = "Apache-2.0"
description = "Invisi SDK core capabilities"

[dependencies]
alloy-primitives = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
hex = "0.4"
ark-bn254 = { version = "0.4", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "0.4", default-features = false }
chacha20poly1305 = "0.10"
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
aes-gcm = "0.10"
hkdf = "0.12"
k256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
zeroize = "1"
decaf377-fmd = "=2.1.1"
