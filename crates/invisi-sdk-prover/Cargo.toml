[package]
name = "invisi-sdk-prover"
version = "1.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Invisi SDK prover capabilities"

readme = "README.md"
repository = "https://github.com/invisi-lab/invisi-sdk-rust"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "assets/**", "provenance/**", "testdata/**", "tests/**", "include/**"]

[dependencies]
invisi-sdk-protocol = { path = "../invisi-sdk-protocol", version = "=1.2.0" }
invisi-sdk-primitives = { path = "../invisi-sdk-primitives", version = "=1.2.0" }
alloy-primitives = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
