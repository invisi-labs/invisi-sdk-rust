[package]
name = "invisi-sdk-session"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Invisi SDK session capabilities"

[dependencies]
invisi-sdk-core = { path = "../invisi-sdk-core" }
invisi-sdk-protocol = { path = "../invisi-sdk-protocol" }
invisi-sdk-rpc = { path = "../invisi-sdk-rpc" }
invisi-sdk-prover = { path = "../invisi-sdk-prover" }
invisi-sdk-runtime = { path = "../invisi-sdk-runtime" }
alloy-primitives = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
hex = "0.4"
alloy-sol-types = { version = "0.8", features = ["json"] }
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rusqlite = { version = "0.38", features = ["bundled"], optional = true }

[features]
default = []
sqlite = ["dep:rusqlite"]
