name: Rust SDK
on:
  push:
    branches: [develop, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.sha }}
