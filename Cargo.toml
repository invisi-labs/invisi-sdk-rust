[package]
name = "invisi-sdk"
version = "1.2.2"
edition = "2021"
authors = ["InvisiPay team"]
license = "Apache-2.0"
description = "Stateless Note and Credit orchestration for the InvisiPay privacy payment protocol"
repository = "https://github.com/invisi-lab/invisi-sdk-rust"
readme = "README.md"
keywords = ["zk", "poseidon2", "bn254", "privacy", "noir"]
categories = ["cryptography"]

include = ["Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md", "RELEASE.md", "src/**", "tests/**", "assets/**", "provenance/**", "testdata/**"]

[lib]
name = "invisi_sdk"

[dependencies]
invisi-sdk-primitives = { path = "crates/invisi-sdk-primitives", version = "=1.2.2" }
invisi-sdk-protocol = { path = "crates/invisi-sdk-protocol", version = "=1.2.2" }
invisi-sdk-prover = { path = "crates/invisi-sdk-prover", version = "=1.2.2" }
invisi-sdk-rpc = { path = "crates/invisi-sdk-rpc", version = "=1.2.2" }

alloy-primitives = { version = "0.8", features = ["serde"] }
alloy-sol-types = { version = "0.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
rand = "0.8"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
alloy-primitives = { version = "0.8", features = ["serde"] }
alloy-sol-types = { version = "0.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
aes-gcm = "0.10"
hkdf = "0.12"
zeroize = "1"
decaf377-fmd = "=2.1.1"
base64 = "0.22"

[workspace]
members = ["crates/*", "examples"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
strip = "debuginfo"
