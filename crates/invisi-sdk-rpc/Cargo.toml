[package]
name = "invisi-sdk-rpc"
version = "1.3.1"
edition = "2021"
license = "Apache-2.0"
description = "Invisi SDK rpc capabilities"

readme = "README.md"
repository = "https://github.com/invisi-labs/invisi-sdk-rust"
include = ["Cargo.toml", "README.md", "LICENSE", "NOTICE", "src/**", "assets/**", "provenance/**", "testdata/**", "tests/**", "include/**"]

[dependencies]
invisi-sdk-primitives = { path = "../invisi-sdk-primitives", version = "=1.3.1" }
invisi-sdk-protocol = { path = "../invisi-sdk-protocol", version = "=1.3.1" }
alloy-primitives = { version = "=1.5.7", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
hex = "0.4"
alloy-sol-types = { version = "=1.5.7", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
k256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
sha2 = "0.10"
decaf377-fmd = "=2.1.1"

alloy-consensus = { version = "=1.7.3", features = ["serde"] }
alloy-eips = { version = "=1.7.3", default-features = false }
