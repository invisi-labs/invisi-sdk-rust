name: Release Rust SDK

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag (all nine crate versions must match)'
        required: true
        default: 'v1.3.1'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: rust-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  previous:
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.lookup.outputs.verified }}
      commit: ${{ steps.lookup.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit&status=success&event=push&per_page=100" --jq '[.workflow_runs[] | select(.head_branch == "develop" or .head_branch == "main")] | length')
          if [ "$count" -gt 0 ]; then
            echo 'verified=true' >> "$GITHUB_OUTPUT"
          else
            echo 'verified=false' >> "$GITHUB_OUTPUT"
          fi
  verify:
    needs: previous
    if: needs.previous.outputs.verified != 'true'
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.previous.outputs.commit }}
  release:
    needs: [previous, verify]
    if: ${{ !cancelled() && needs.previous.result == 'success' && (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && needs.previous.outputs.verified == 'true')) && github.repository == 'invisi-labs/invisi-sdk-rust' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      VERIFIED_COMMIT: ${{ needs.previous.outputs.commit }}
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.previous.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.0'
          components: rustfmt, clippy
      - name: Validate repository, tag and nine-crate version cohort
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_COMMIT"
          python3 scripts/publish-release.py --tag "$RELEASE_TAG" --validate-only
      - name: Validate complete versioned release notes
        run: |
          python3 scripts/release-notes.py "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
      - name: Check registry credential configuration
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo '::error::Missing CARGO_REGISTRY_TOKEN repository Actions secret. Configure https://github.com/invisi-labs/invisi-sdk-rust/settings/secrets/actions/new before rerunning this tag.'
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish
          workspaces: . -> target
      - name: Publish exact tagged archives in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          python3 scripts/publish-release.py --tag "$RELEASE_TAG" \
            --target-dir "$GITHUB_WORKSPACE/target" \
            --report "$RUNNER_TEMP/invisi-release-checksums.json"
      - name: Retain registry integrity report
        uses: actions/upload-artifact@v4
        with:
          name: rust-registry-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/invisi-release-checksums.json
          if-no-files-found: error
      - name: Create GitHub release after all nine registrations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false \
              --title "Rust SDK $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Rust SDK $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" \
              "$RUNNER_TEMP/invisi-release-checksums.json" \
              "$GITHUB_WORKSPACE"/target/package/invisi-sdk*-*.crate
          fi
