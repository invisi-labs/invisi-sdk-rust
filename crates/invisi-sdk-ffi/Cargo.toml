[package]
name = "invisi-sdk-ffi"
version = "1.2.2"
edition = "2021"
license = "Apache-2.0"
description = "Invisi SDK C ABI exports and host-executed wallet requests"

readme = "README.md"
repository = "https://github.com/invisi-lab/invisi-sdk-rust"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "assets/**", "provenance/**", "testdata/**", "tests/**", "include/**"]

[lib]
name = "invisi_sdk_ffi"
# rlib lets Rust hosts re-export the C ABI; staticlib/cdylib serve native hosts.
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
invisi-sdk-primitives = { path = "../invisi-sdk-primitives", version = "=1.2.2" }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
hex = "0.4"
