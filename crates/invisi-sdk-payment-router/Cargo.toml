[package]
name = "invisi-sdk-payment-router"
version = "1.3.4"
edition = "2021"
license = "Apache-2.0"
description = "Detached native ETH Payment Router preparation, quoting and simulation for Invisi"
repository = "https://github.com/invisi-labs/invisi-sdk-rust"
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "NOTICE", "src/**", "tests/**", "testdata/**", "examples/**"]

[dependencies]
invisi-sdk = { path = "../..", version = "=1.3.4" }
invisi-sdk-protocol = { path = "../invisi-sdk-protocol", version = "=1.3.4" }
alloy-primitives = { version = "=1.5.7", features = ["serde"] }
alloy-sol-types = { version = "=1.5.7", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "macros", "rt"] }

k256 = { version = "0.13", features = ["ecdsa"] }

[dev-dependencies]
