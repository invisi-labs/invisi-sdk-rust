[package]
name = "invisi-sdk-prover"
version = "1.3.2"
edition = "2021"
license = "Apache-2.0"
description = "Invisi SDK prover capabilities"

readme = "README.md"
repository = "https://github.com/invisi-labs/invisi-sdk-rust"
include = ["Cargo.toml", "README.md", "LICENSE", "NOTICE", "src/**", "assets/**", "provenance/manifest.json", "testdata/**", "tests/**", "include/**"]

[dependencies]
invisi-sdk-protocol = { path = "../invisi-sdk-protocol", version = "=1.3.2" }
invisi-sdk-primitives = { path = "../invisi-sdk-primitives", version = "=1.3.2" }
alloy-primitives = { version = "=1.5.7", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
