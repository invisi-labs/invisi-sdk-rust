[package]
name = "invisi-sdk-prover"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Invisi SDK prover capabilities"

[dependencies]
invisi-sdk-core = { path = "../invisi-sdk-core" }
alloy-primitives = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
