[package]
name = "invisi-sdk-protocol"
version = "1.3.4"
edition = "2021"
license = "Apache-2.0"
description = "Invisi SDK protocol capabilities"

readme = "README.md"
repository = "https://github.com/invisi-labs/invisi-sdk-rust"
include = ["Cargo.toml", "README.md", "LICENSE", "NOTICE", "src/**", "assets/**", "provenance/**", "testdata/**", "tests/**", "include/**"]

[dependencies]
invisi-sdk-primitives = { path = "../invisi-sdk-primitives", version = "=1.3.4" }
alloy-primitives = { version = "=1.5.7", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
hex = "0.4"
alloy-sol-types = { version = "=1.5.7", features = ["json"] }
sha2 = "0.10"
ed25519-dalek = "2"
