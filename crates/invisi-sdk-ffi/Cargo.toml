[package]
name = "invisi-sdk-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Invisi SDK C ABI exports and host-executed wallet requests"

[lib]
name = "invisi_sdk_ffi"
# rlib lets Rust hosts re-export the C ABI; staticlib/cdylib serve native hosts.
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
invisi-core = { package = "invisi-sdk-core", path = "../invisi-sdk-core" }
invisi-sdk-payer = { path = "../invisi-sdk-payer" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
