name: Release Rust SDK

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag (all eight crate versions must match)'
        required: true
        default: 'v1.2.5'
        type: string

permissions:
  contents: read

concurrency:
  group: rust-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'invisi-lab/invisi-sdk-rust'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.0'
          components: rustfmt, clippy
      - name: Validate repository, tag and eight-crate version cohort
        run: python3 scripts/publish-release.py --tag "$RELEASE_TAG" --validate-only
      - name: Check registry credential configuration
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo '::error::Missing CARGO_REGISTRY_TOKEN repository Actions secret. Configure https://github.com/invisi-lab/invisi-sdk-rust/settings/secrets/actions/new before rerunning this tag.'
            exit 1
          fi
      - name: Test release safety and module boundaries
        run: |
          python3 scripts/test_publish_release.py
          python3 scripts/check-english.py
          python3 scripts/check-boundaries.py
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-features --all-targets
      - name: Test workspace
        run: |
          cargo test --locked --workspace --all-features
          cargo test --locked --workspace --all-features --release
      - name: Verify native adapter and example
        run: |
          cargo build --locked -p invisi-sdk-ffi --release
          python3 scripts/check-native-exports.py target/release/libinvisi_sdk_ffi.so
          cargo run --locked -p invisi-sdk-examples --bin note-output
      - name: Verify and test all distributable archives with fresh sources
        run: python3 scripts/check-release.py --work-dir "$RUNNER_TEMP/invisi-release-validation"
      - name: Publish exact tagged archives in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          python3 scripts/publish-release.py --tag "$RELEASE_TAG" \
            --target-dir "$RUNNER_TEMP/invisi-release-publish" \
            --report "$RUNNER_TEMP/invisi-release-checksums.json"
      - name: Retain registry integrity report
        uses: actions/upload-artifact@v4
        with:
          name: rust-registry-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/invisi-release-checksums.json
          if-no-files-found: error
      - name: Create GitHub release after all eight registrations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release already exists for $RELEASE_TAG; registry archives were independently verified."
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Rust SDK $RELEASE_TAG" --notes-file CHANGELOG.md \
              "$RUNNER_TEMP/invisi-release-checksums.json" \
              "$RUNNER_TEMP"/invisi-release-publish/package/invisi-sdk*-*.crate
          fi
